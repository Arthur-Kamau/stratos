<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 12px 24px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 { font-size: 16px; color: #e94560; }
        header span { font-size: 12px; color: #888; }
        #output {
            flex: 1;
            padding: 16px 24px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-y: auto;
        }
        .line { color: #a0e0a0; }
        .error { color: #e94560; }
        .info { color: #888; font-style: italic; }
        footer {
            background: #16213e;
            padding: 8px 24px;
            border-top: 1px solid #0f3460;
            font-size: 11px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        #status { color: #e94560; }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 16px;
            color: #888;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .loading span { animation: pulse 1.5s ease-in-out infinite; }
    </style>
</head>
<body>
    <header>
        <h1>Stratos</h1>
        <span>{{TITLE}} — WASM</span>
    </header>
    <div id="output">
        <div class="loading"><span>Loading WASM module...</span></div>
    </div>
    <footer>
        <span>Compiled with Stratos</span>
        <span id="status">loading</span>
        <span id="time"></span>
    </footer>

    <script src="runtime.js"></script>
    <script>
        (async () => {
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            const timeEl = document.getElementById('time');
            output.innerHTML = '';

            function addLine(text, cls = 'line') {
                const div = document.createElement('div');
                div.className = cls;
                div.textContent = text;
                output.appendChild(div);
                output.scrollTop = output.scrollHeight;
            }

            try {
                const rt = new StratosRuntime();
                rt.onOutput = (line) => addLine(line);

                addLine('Initializing Stratos WASM runtime...', 'info');
                const start = performance.now();

                await rt.run('{{WASM_FILE}}');

                const elapsed = (performance.now() - start).toFixed(1);
                addLine(`\nCompleted in ${elapsed}ms`, 'info');
                status.textContent = 'done';
                status.style.color = '#a0e0a0';
                timeEl.textContent = `${elapsed}ms`;
            } catch (err) {
                addLine('Error: ' + err.message, 'error');
                if (err.stack) addLine(err.stack, 'error');
                status.textContent = 'error';
                console.error(err);
            }
        })();
    </script>
</body>
</html>
