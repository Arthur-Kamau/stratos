name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.0.0, etc.
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            artifact_name: stratos
            asset_name: stratos-linux-x86_64

          # macOS builds
          - os: macos-latest
            platform: macos
            arch: x86_64
            artifact_name: stratos
            asset_name: stratos-macos-x86_64

          # macOS ARM (M1/M2)
          - os: macos-latest
            platform: macos
            arch: aarch64
            artifact_name: stratos
            asset_name: stratos-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up build tools
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential g++ cmake
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            # macOS already has clang/g++
            echo "Build tools already available"
          fi

      - name: Build Stratos
        run: |
          cd interpreter/C++
          bash build.sh

      - name: Verify build
        run: |
          ls -lh interpreter/C++/build/stratos
          ./interpreter/C++/build/stratos --version || echo "Version: $(git describe --tags)"

      - name: Prepare artifact
        run: |
          cp interpreter/C++/build/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}
          tar -czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish install script to GitHub Pages
  publish-install-script:
    name: Publish Install Script
    runs-on: ubuntu-latest
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false
          commit_message: 'Deploy install script for ${{ github.ref_name }}'
          destination_dir: .
